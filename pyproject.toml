[project]
name = "buzzwire"
version = "0.1.0"
description = "BuzzWire viral newsroom operating system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "feedparser>=6.0,<7.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.vercel]
entrypoint = "buzzwire.main:app"
